name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    # The official Python images: hosted runners no longer carry every version the SDK supports.
    container: python:${{ matrix.python }}-slim
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: tests, no dependencies
        run: python -m unittest discover -s tests -v
      - name: tests with py-algorand-sdk installed
        run: |
          python -m pip install "py-algorand-sdk>=2.0"
          python -m unittest discover -s tests -v
